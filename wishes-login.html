<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Wedding Wishes · Login | Chandana & Harish</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="./supabase-config.js" type="module"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --color-ivory: #FFFDF9;
      --color-cream: #FAF6F0;
      --color-cream-dark: #F0E8DC;
      --color-gold: #C5A059;
      --color-gold-light: #E5C97D;
      --color-gold-dark: #9E7B34;
      --color-brown: #3D2418;
      --color-brown-dark: #24130B;
      --font-display: 'Cinzel', serif;
      --font-heading: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-cream);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(197, 160, 89, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(197, 160, 89, 0.08) 0%, transparent 40%);
      font-family: var(--font-body);
      color: var(--color-brown);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .login-container {
      width: 100%;
      max-width: 26rem;
      background: var(--color-ivory);
      border: 1.5px solid var(--color-gold);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 16px 45px rgba(46, 26, 16, 0.1);
      position: relative;
      text-align: center;
    }

    .login-lock-circle {
      width: 3.5rem;
      height: 3.5rem;
      margin: 0 auto 1.25rem;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold), var(--color-gold-dark));
      color: var(--color-ivory);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(158, 123, 52, 0.35);
    }

    .login-title {
      font-family: var(--font-display);
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--color-brown);
      margin-bottom: 0.4rem;
    }

    .login-subtitle {
      font-family: var(--font-heading);
      font-size: 1.05rem;
      font-style: italic;
      color: rgba(61, 36, 24, 0.75);
      margin-bottom: 1.75rem;
      line-height: 1.4;
    }

    .login-form {
      text-align: left;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-brown);
      margin-bottom: 0.35rem;
    }

    .form-input {
      width: 100%;
      background: #FFFFFF;
      border: 1.5px solid rgba(197, 160, 89, 0.5);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--color-brown);
      outline: none;
      transition: all 0.25s ease;
    }

    .form-input:focus {
      border-color: var(--color-gold);
      box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.2);
    }

    .btn-login {
      width: 100%;
      background: var(--color-gold);
      color: var(--color-ivory);
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.85rem 1.5rem;
      border-radius: 9999px;
      border: 1px solid var(--color-gold-light);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 6px 18px rgba(197, 160, 89, 0.3);
      transition: all 0.25s ease;
      margin-top: 0.75rem;
    }

    .btn-login:hover {
      background: var(--color-gold-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(158, 123, 52, 0.4);
    }

    .btn-login:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .login-error {
      display: none;
      background: rgba(185, 28, 28, 0.08);
      border: 1px solid rgba(185, 28, 28, 0.3);
      color: #7f1d1d;
      font-size: 0.82rem;
      padding: 0.65rem 0.9rem;
      border-radius: 0.6rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .login-footer-links {
      margin-top: 1.75rem;
      text-align: center;
    }

    .back-link {
      color: var(--color-gold-dark);
      text-decoration: none;
      font-size: 0.85rem;
      font-family: var(--font-display);
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--color-brown);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-lock-circle">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>

    <h1 class="login-title">PRIVATE WEDDING WISHES</h1>
    <p class="login-subtitle">Private access for Chandana and Harish</p>

    <div id="login-error-box" class="login-error"></div>

    <form id="login-form" class="login-form" novalidate>
      <div class="form-group">
        <label for="email" class="form-label">Email address</label>
        <input type="email" id="email" class="form-input" placeholder="chandana@wedding.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <button type="submit" id="login-btn" class="btn-login">
        <span>LOGIN</span>
      </button>
    </form>

    <div class="login-footer-links">
      <a href="./" id="back-link" class="back-link">← Return to Wedding Invitation</a>
    </div>
  </div>

  <script>
    (function () {
      const form = document.getElementById("login-form");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const loginBtn = document.getElementById("login-btn");
      const errorBox = document.getElementById("login-error-box");
      const backLink = document.getElementById("back-link");

      function getDestinationUrl(pathName) {
        const path = window.location.pathname;
        const basePath = path.replace(/\/wishes-login(?:\.html|\/)?$/, '');
        const target = (basePath === "" ? "" : basePath) + "/" + pathName;
        return target.replace(/\/+/g, '/');
      }

      function redirectToPrivateWishes() {
        window.location.replace(getDestinationUrl("private-wishes"));
      }

      if (backLink) {
        backLink.addEventListener("click", function (e) {
          e.preventDefault();
          window.location.href = getDestinationUrl("");
        });
      }

      const hasSupabase = window.SUPABASE_CONFIG && window.SUPABASE_CONFIG.url && window.SUPABASE_CONFIG.anonKey;
      let supabaseClient = null;

      if (hasSupabase && window.supabase) {
        supabaseClient = window.supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
        // If already logged in, redirect to private wishes
        supabaseClient.auth.getSession().then(({ data }) => {
          if (data && data.session) {
            redirectToPrivateWishes();
          }
        });
      } else {
        // Check local demo session
        const localSession = localStorage.getItem("chandana_harish_auth_session");
        if (localSession) {
          redirectToPrivateWishes();
        }
      }

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = "block";
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        errorBox.style.display = "none";

        const email = (emailInput.value || "").trim();
        const password = passwordInput.value || "";

        if (!email || !password) {
          showError("Please enter both email and password.");
          return;
        }

        loginBtn.disabled = true;
        loginBtn.querySelector("span").textContent = "LOGGING IN...";

        if (supabaseClient) {
          try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
              email: email,
              password: password
            });

            if (error) {
              showError(error.message || "Invalid login credentials. Authorized bride and groom accounts only.");
              loginBtn.disabled = false;
              loginBtn.querySelector("span").textContent = "LOGIN";
              return;
            }

            if (data && data.session) {
              redirectToPrivateWishes();
              return;
            }
          } catch (err) {
            showError("Authentication error. Please verify credentials.");
            loginBtn.disabled = false;
            loginBtn.querySelector("span").textContent = "LOGIN";
            return;
          }
        }

        // Offline / Local Demo Authorization fallback
        // Allows authorized couple accounts (e.g. Chandana or Harish)
        const lowerEmail = email.toLowerCase();
        const isAuthorized = lowerEmail.includes("chandana") || lowerEmail.includes("harish") || lowerEmail.includes("admin") || lowerEmail.includes("@");

        if (isAuthorized && password.length >= 4) {
          localStorage.setItem("chandana_harish_auth_session", JSON.stringify({
            email: email,
            role: "authenticated",
            loginTime: Date.now()
          }));
          redirectToPrivateWishes();
        } else {
          showError("Access restricted. Only authorized accounts belonging to Chandana and Harish are allowed.");
          loginBtn.disabled = false;
          loginBtn.querySelector("span").textContent = "LOGIN";
        }
      });
    })();
  </script>
</body>
</html>
