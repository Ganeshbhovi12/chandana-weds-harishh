<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Wedding Wishes | Chandana & Harish</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="./supabase-config.js" type="module"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --color-ivory: #FFFDF9;
      --color-cream: #FAF6F0;
      --color-cream-dark: #F0E8DC;
      --color-gold: #C5A059;
      --color-gold-light: #E5C97D;
      --color-gold-dark: #9E7B34;
      --color-brown: #3D2418;
      --color-brown-dark: #24130B;
      --font-display: 'Cinzel', serif;
      --font-heading: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-cream);
      background-image: 
        radial-gradient(circle at 10% 15%, rgba(197, 160, 89, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 90% 85%, rgba(197, 160, 89, 0.08) 0%, transparent 45%);
      font-family: var(--font-body);
      color: var(--color-brown);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    body.authenticated {
      opacity: 1;
    }

    /* Top Navigation Bar */
    .top-bar {
      background: rgba(255, 253, 249, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(197, 160, 89, 0.35);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 0.85rem 1.5rem;
    }

    .top-bar-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: var(--color-brown);
    }

    .brand-lock-icon {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold));
      color: var(--color-ivory);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(158, 123, 52, 0.25);
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--color-brown-dark);
    }

    .brand-subtitle {
      font-size: 0.7rem;
      color: var(--color-gold-dark);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-return {
      color: var(--color-brown);
      text-decoration: none;
      font-size: 0.8rem;
      font-family: var(--font-display);
      letter-spacing: 0.05em;
      padding: 0.4rem 0.75rem;
      border-radius: 9999px;
      border: 1px solid rgba(197, 160, 89, 0.4);
      background: #FFFFFF;
      transition: all 0.2s ease;
    }

    .btn-return:hover {
      background: var(--color-cream);
      border-color: var(--color-gold);
    }

    .btn-logout {
      background: var(--color-brown-dark);
      color: var(--color-ivory);
      border: 1px solid var(--color-gold);
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.45rem 1rem;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .btn-logout:hover {
      background: #000000;
      transform: translateY(-1px);
    }

    /* Main Container */
    .dashboard-container {
      max-width: 900px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1.25rem 4rem;
      flex: 1;
    }

    /* Header Section */
    .dashboard-header {
      background: var(--color-ivory);
      border: 1.5px solid var(--color-gold);
      border-radius: 1.25rem;
      padding: 1.75rem 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 10px 30px rgba(46, 26, 16, 0.07);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    @media (min-width: 640px) {
      .dashboard-header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .header-info h1 {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--color-brown-dark);
      margin-bottom: 0.25rem;
    }

    .header-info p {
      font-family: var(--font-heading);
      font-style: italic;
      font-size: 1.1rem;
      color: rgba(61, 36, 24, 0.75);
    }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .stat-badge {
      background: var(--color-cream);
      border: 1px solid rgba(197, 160, 89, 0.5);
      border-radius: 0.75rem;
      padding: 0.5rem 0.9rem;
      text-align: center;
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-gold-dark);
      display: block;
      line-height: 1.2;
    }

    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      color: rgba(61, 36, 24, 0.7);
    }

    /* Filter & Controls Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .filter-tabs {
      display: inline-flex;
      background: var(--color-ivory);
      border: 1px solid rgba(197, 160, 89, 0.45);
      border-radius: 9999px;
      padding: 0.25rem;
    }

    .filter-tab {
      background: none;
      border: none;
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      color: rgba(61, 36, 24, 0.65);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-tab.active {
      background: var(--color-gold);
      color: var(--color-ivory);
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 18rem;
    }

    .search-input {
      width: 100%;
      background: var(--color-ivory);
      border: 1px solid rgba(197, 160, 89, 0.45);
      border-radius: 9999px;
      padding: 0.4rem 0.9rem 0.4rem 2.2rem;
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--color-brown);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--color-gold);
    }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(197, 160, 89, 0.7);
      pointer-events: none;
    }

    /* Wishes List */
    .wishes-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .wish-card {
      background: var(--color-ivory);
      border: 1px solid rgba(197, 160, 89, 0.45);
      border-radius: 1.15rem;
      padding: 1.35rem 1.6rem;
      box-shadow: 0 4px 18px rgba(46, 26, 16, 0.05);
      transition: all 0.25s ease;
      position: relative;
    }

    .wish-card:hover {
      box-shadow: 0 8px 24px rgba(46, 26, 16, 0.1);
      border-color: var(--color-gold);
    }

    .wish-card.unread {
      border-left: 4.5px solid var(--color-gold);
      background: linear-gradient(to right, rgba(250, 244, 232, 0.6), var(--color-ivory));
    }

    .wish-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }

    .guest-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .guest-name {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--color-brown-dark);
      letter-spacing: 0.03em;
    }

    .badge-status {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.15rem 0.45rem;
      border-radius: 9999px;
    }

    .badge-new {
      background: rgba(197, 160, 89, 0.2);
      color: var(--color-gold-dark);
      border: 1px solid rgba(197, 160, 89, 0.5);
    }

    .badge-read {
      background: rgba(61, 36, 24, 0.08);
      color: rgba(61, 36, 24, 0.6);
    }

    .wish-timestamp {
      font-size: 0.75rem;
      color: rgba(61, 36, 24, 0.6);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
    }

    .wish-message {
      font-family: var(--font-heading);
      font-size: 1.15rem;
      line-height: 1.6;
      font-style: italic;
      color: rgba(46, 26, 16, 0.95);
      margin-bottom: 1rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .wish-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(197, 160, 89, 0.25);
      padding-top: 0.75rem;
    }

    .wish-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .btn-action {
      background: none;
      border: 1px solid rgba(197, 160, 89, 0.4);
      padding: 0.3rem 0.65rem;
      border-radius: 0.5rem;
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--color-brown);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: var(--color-cream);
      border-color: var(--color-gold);
    }

    .btn-delete {
      color: #991b1b;
      border-color: rgba(153, 27, 27, 0.3);
    }

    .btn-delete:hover {
      background: rgba(153, 27, 27, 0.08);
      border-color: #991b1b;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3.5rem 1.5rem;
      background: var(--color-ivory);
      border: 1.5px dashed rgba(197, 160, 89, 0.5);
      border-radius: 1.25rem;
    }

    .empty-icon {
      width: 3.5rem;
      height: 3.5rem;
      margin: 0 auto 1rem;
      border-radius: 50%;
      background: var(--color-cream);
      color: var(--color-gold);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--color-brown-dark);
      margin-bottom: 0.4rem;
    }

    .empty-text {
      font-family: var(--font-heading);
      font-size: 1.05rem;
      font-style: italic;
      color: rgba(61, 36, 24, 0.7);
      max-width: 24rem;
      margin: 0 auto;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--color-brown-dark);
      color: var(--color-ivory);
      border: 1px solid var(--color-gold);
      padding: 0.75rem 1.25rem;
      border-radius: 0.75rem;
      font-size: 0.85rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      display: none;
      align-items: center;
      gap: 0.5rem;
      z-index: 100;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="top-bar">
    <div class="top-bar-inner">
      <a href="./" class="brand-link" title="Chandana & Harish Wedding">
        <div class="brand-lock-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <div>
          <div class="brand-title">CHANDANA & HARISH</div>
          <div class="brand-subtitle">Private Wedding Wishes</div>
        </div>
      </a>

      <div class="top-actions">
        <a href="./" class="btn-return">← Return to Website</a>
        <button id="logout-btn" class="btn-logout" title="Sign out">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>LOGOUT</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="dashboard-container">

    <!-- Header Section with Stats -->
    <section class="dashboard-header">
      <div class="header-info">
        <h1>GUEST BLESSINGS</h1>
        <p>Private messages shared by family and friends for the couple.</p>
      </div>
      <div class="header-stats">
        <div class="stat-badge">
          <span class="stat-value" id="total-count">0</span>
          <span class="stat-label">Total Wishes</span>
        </div>
        <div class="stat-badge">
          <span class="stat-value" id="unread-count" style="color: #991b1b;">0</span>
          <span class="stat-label">Unread</span>
        </div>
      </div>
    </section>

    <!-- Filter & Search Toolbar -->
    <div class="toolbar">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All Wishes</button>
        <button class="filter-tab" data-filter="unread">Unread Only</button>
        <button class="filter-tab" data-filter="read">Read</button>
      </div>

      <div class="search-box">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search by name or message..." />
      </div>
    </div>

    <!-- Wishes List -->
    <div id="wishes-container" class="wishes-list">
      <!-- Populated dynamically -->
    </div>

  </main>

  <div id="toast" class="toast"></div>

  <script>
    (function () {
      "use strict";

      const hasSupabase = window.SUPABASE_CONFIG && window.SUPABASE_CONFIG.url && window.SUPABASE_CONFIG.anonKey;
      let supabaseClient = null;
      let allWishes = [];
      let currentFilter = "all";
      let searchQuery = "";

      const STORAGE_KEY = "chandana_harish_guest_wishes_v1";

      function getLoginUrl() {
        const path = window.location.pathname;
        const basePath = path.replace(/\/private-wishes(?:\.html|\/)?$/, '');
        return (basePath === "" ? "" : basePath) + "/wishes-login";
      }

      function redirectToLogin() {
        window.location.replace(getLoginUrl());
      }

      function showToast(msg) {
        const toast = document.getElementById("toast");
        if (!toast) return;
        toast.textContent = msg;
        toast.style.display = "flex";
        setTimeout(() => {
          toast.style.display = "none";
        }, 3000);
      }

      function escapeHtml(str) {
        if (!str) return "";
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function formatDate(timestamp) {
        if (!timestamp) return "Recently";
        try {
          const d = new Date(timestamp);
          if (isNaN(d.getTime())) return "Recently";
          return d.toLocaleDateString("en-IN", {
            day: "numeric",
            month: "short",
            year: "numeric"
          }) + " · " + d.toLocaleTimeString("en-IN", {
            hour: "2-digit",
            minute: "2-digit"
          });
        } catch (e) {
          return "Recently";
        }
      }

      // Check Authentication
      async function verifyAuth() {
        if (hasSupabase && window.supabase) {
          supabaseClient = window.supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
          const { data } = await supabaseClient.auth.getSession();
          if (!data || !data.session) {
            // Also check local demo fallback
            const localSession = localStorage.getItem("chandana_harish_auth_session");
            if (!localSession) {
              redirectToLogin();
              return false;
            }
          }
        } else {
          const localSession = localStorage.getItem("chandana_harish_auth_session");
          if (!localSession) {
            redirectToLogin();
            return false;
          }
        }

        document.body.classList.add("authenticated");
        return true;
      }

      // Fetch Wishes
      async function loadWishes() {
        if (supabaseClient) {
          try {
            const { data, error } = await supabaseClient
              .from("wedding_wishes")
              .select("*")
              .order("created_at", { ascending: false });

            if (!error && Array.isArray(data)) {
              allWishes = data.map(w => ({
                id: w.id,
                name: w.guest_name,
                message: w.message,
                isRead: !!w.is_read,
                createdAt: w.created_at
              }));
              renderWishes();
              return;
            }
          } catch (e) {
            console.warn("Error fetching wishes from Supabase:", e);
          }
        }

        // Local storage demo fallback
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const stored = raw ? JSON.parse(raw) : [];
          allWishes = stored.map(w => ({
            id: w.id,
            name: w.name || w.guest_name,
            message: w.message,
            isRead: !!w.isRead,
            createdAt: w.createdAt || Date.now()
          }));
        } catch (e) {
          allWishes = [];
        }

        renderWishes();
      }

      // Render UI
      function renderWishes() {
        const container = document.getElementById("wishes-container");
        const totalCountEl = document.getElementById("total-count");
        const unreadCountEl = document.getElementById("unread-count");

        const unreadTotal = allWishes.filter(w => !w.isRead).length;
        if (totalCountEl) totalCountEl.textContent = allWishes.length;
        if (unreadCountEl) unreadCountEl.textContent = unreadTotal;

        // Apply filters
        let filtered = allWishes.filter(w => {
          if (currentFilter === "unread") return !w.isRead;
          if (currentFilter === "read") return w.isRead;
          return true;
        });

        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          filtered = filtered.filter(w => 
            (w.name && w.name.toLowerCase().includes(q)) ||
            (w.message && w.message.toLowerCase().includes(q))
          );
        }

        if (filtered.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
              </div>
              <h3 class="empty-title">No Wishes Found</h3>
              <p class="empty-text">
                ${searchQuery ? "No blessings match your search query." : "When guests share their blessings, they will appear here privately for Chandana & Harish."}
              </p>
            </div>
          `;
          return;
        }

        container.innerHTML = filtered.map(w => `
          <div class="wish-card ${w.isRead ? '' : 'unread'}" data-id="${w.id}">
            <div class="wish-card-header">
              <div class="guest-info">
                <span class="guest-name">${escapeHtml(w.name)}</span>
                <span class="badge-status ${w.isRead ? 'badge-read' : 'badge-new'}">
                  ${w.isRead ? 'Read' : 'New'}
                </span>
              </div>
              <div class="wish-timestamp">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>${formatDate(w.createdAt)}</span>
              </div>
            </div>

            <div class="wish-message">"${escapeHtml(w.message)}"</div>

            <div class="wish-card-footer">
              <div class="wish-actions">
                <button class="btn-action toggle-read-btn" data-id="${w.id}" data-read="${w.isRead ? 'true' : 'false'}">
                  ${w.isRead ? 'Mark as Unread' : '✓ Mark as Read'}
                </button>
              </div>
              <button class="btn-action btn-delete delete-wish-btn" data-id="${w.id}">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                <span>Delete</span>
              </button>
            </div>
          </div>
        `).join("");

        // Attach action handlers
        container.querySelectorAll(".toggle-read-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-id");
            const currentRead = btn.getAttribute("data-read") === "true";
            toggleWishRead(id, !currentRead);
          });
        });

        container.querySelectorAll(".delete-wish-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-id");
            deleteWish(id);
          });
        });
      }

      // Mark as read/unread
      async function toggleWishRead(id, newStatus) {
        if (supabaseClient) {
          try {
            await supabaseClient
              .from("wedding_wishes")
              .update({ is_read: newStatus })
              .eq("id", id);
          } catch (e) {
            console.warn("Supabase update failed:", e);
          }
        }

        const wish = allWishes.find(w => w.id === id);
        if (wish) {
          wish.isRead = newStatus;
          saveLocalWishes();
          renderWishes();
          showToast(newStatus ? "Marked wish as read." : "Marked wish as unread.");
        }
      }

      // Delete wish
      async function deleteWish(id) {
        if (!confirm("Are you sure you want to delete this wedding wish?")) {
          return;
        }

        if (supabaseClient) {
          try {
            await supabaseClient
              .from("wedding_wishes")
              .delete()
              .eq("id", id);
          } catch (e) {
            console.warn("Supabase delete failed:", e);
          }
        }

        allWishes = allWishes.filter(w => w.id !== id);
        saveLocalWishes();
        renderWishes();
        showToast("Wedding wish deleted.");
      }

      function saveLocalWishes() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(allWishes));
        } catch (e) {}
      }

      // Logout
      async function logout() {
        if (supabaseClient) {
          try {
            await supabaseClient.auth.signOut();
          } catch (e) {}
        }
        localStorage.removeItem("chandana_harish_auth_session");
        redirectToLogin();
      }

      function getHomeUrl() {
        const path = window.location.pathname;
        const basePath = path.replace(/\/private-wishes(?:\.html|\/)?$/, '');
        return (basePath === "" ? "/" : basePath + "/").replace(/\/+/g, '/');
      }

      // Initialize
      document.addEventListener("DOMContentLoaded", async () => {
        const isAuthed = await verifyAuth();
        if (!isAuthed) return;

        loadWishes();

        document.querySelectorAll(".brand-link, .btn-return").forEach(el => {
          el.addEventListener("click", (e) => {
            e.preventDefault();
            window.location.href = getHomeUrl();
          });
        });

        // Logout button
        const logoutBtn = document.getElementById("logout-btn");
        if (logoutBtn) {
          logoutBtn.addEventListener("click", logout);
        }

        // Filter tabs
        document.querySelectorAll(".filter-tab").forEach(tab => {
          tab.addEventListener("click", () => {
            document.querySelectorAll(".filter-tab").forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            currentFilter = tab.getAttribute("data-filter");
            renderWishes();
          });
        });

        // Search input
        const searchInput = document.getElementById("search-input");
        if (searchInput) {
          searchInput.addEventListener("input", (e) => {
            searchQuery = (e.target.value || "").trim();
            renderWishes();
          });
        }
      });
    })();
  </script>
</body>
</html>
